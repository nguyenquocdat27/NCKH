<!-- ========== CHỌN THIẾT BỊ ========== -->
<div id="device-screen" class="hidden min-h-screen relative flex items-center justify-center p-4 sm:p-6 overflow-hidden">
  
  <!-- Background Image & Overlay -->
  <div class="absolute inset-0 z-0">
    <img src="assets/images/chili_sensor_iot.png" alt="IoT Background" class="w-full h-full object-cover animate-[sway_30s_ease-in-out_infinite]" />
    <div class="absolute inset-0 bg-gradient-to-tr from-[#F4F9F4]/95 to-[#E6F2EB]/80 backdrop-blur-[4px]"></div>
  </div>

  <div class="w-full max-w-sm z-10 relative">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto mb-5 rounded-3xl bg-white/50 backdrop-blur-md flex items-center justify-center shadow-xl border border-white/60 animate-float">
        <i data-lucide="leaf" class="w-10 h-10 text-[#2D6A4F]"></i>
      </div>
      <h1 class="text-3xl font-bold font-sans text-[#1B4332] tracking-wide mb-2 drop-shadow-sm">Trải nghiệm của bạn</h1>
      <p class="text-[#2D6A4F] font-medium text-sm">Chọn thiết bị đang sử dụng để tối ưu giao diện</p>
    </div>
    
    <div class="space-y-4">
      <button onclick="selectDevice('desktop')" class="card-hover w-full glass-card rounded-[24px] p-8 border border-white/60 shadow-xl hover:shadow-2xl transition-all text-center group relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-white/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
        <div class="w-20 h-20 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform duration-500 relative z-10">
          <i data-lucide="monitor" class="w-10 h-10 text-blue-600"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-800 mb-2 font-sans group-hover:text-blue-700 transition-colors relative z-10">Máy tính</h3>
        <p class="text-sm text-slate-500 font-medium relative z-10">Dành cho Desktop / Laptop</p>
      </button>
      
      <button onclick="selectDevice('mobile')" class="card-hover w-full glass-card rounded-[24px] p-8 border border-white/60 shadow-xl hover:shadow-2xl transition-all text-center group relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-white/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
        <div class="w-20 h-20 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-[#E6F2EB] to-[#CDE4D6] flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform duration-500 relative z-10">
          <i data-lucide="smartphone" class="w-10 h-10 text-[#2D6A4F]"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-800 mb-2 font-sans group-hover:text-[#2D6A4F] transition-colors relative z-10">Điện thoại</h3>
        <p class="text-sm text-slate-500 font-medium relative z-10">Dành cho Mobile / Tablet</p>
      </button>
    </div>
    
    <div class="text-center mt-10">
      <button onclick="backToUserType()" class="text-slate-500 hover:text-[#2D6A4F] text-sm font-bold flex items-center justify-center gap-2 mx-auto transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Quay lại chọn chế độ
      </button>
    </div>
  </div>
</div>
