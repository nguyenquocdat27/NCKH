<!-- ========== AUTH SCREEN ========== -->
<div id="auth-screen" class="hidden min-h-screen relative flex items-center justify-center p-4 sm:p-6 overflow-hidden">
  
  <!-- Background Image & Overlay -->
  <div class="absolute inset-0 z-0">
    <img src="assets/images/research_lab.png" alt="Research Lab Background" class="w-full h-full object-cover animate-[sway_25s_ease-in-out_infinite]" />
    <div class="absolute inset-0 bg-gradient-to-tr from-[#2D6A4F]/95 to-[#0F291E]/80 backdrop-blur-[4px]"></div>
  </div>

  <div class="w-full max-w-sm z-10 relative">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto mb-5 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center shadow-xl border border-white/20 animate-float">
        <i data-lucide="microscope" class="w-10 h-10 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold font-sans text-white tracking-wide mb-2 drop-shadow-md">Nền tảng AI</h1>
      <p class="text-[#a7f3d0] font-medium text-sm drop-shadow-sm">Đăng nhập để truy cập công cụ phân tích</p>
    </div>
    
    <div class="flex gap-4 mb-6 bg-white/10 backdrop-blur-md rounded-xl p-1.5 shadow-lg border border-white/20">
      <button id="login-tab" class="flex-1 py-2.5 rounded-lg font-bold text-[#2D6A4F] bg-white transition-all shadow-sm" onclick="switchAuthTab('login')">Đăng nhập</button>
      <button id="signup-tab" class="flex-1 py-2.5 rounded-lg font-bold text-white hover:bg-white/10 transition-all" onclick="switchAuthTab('signup')">Đăng ký</button>
    </div>
    
    <!-- Login Form -->
    <div id="login-form" class="glass-card rounded-[24px] p-7 shadow-2xl relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-[#52B788] rounded-full blur-3xl opacity-30"></div>
      <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-[#8B6914] rounded-full blur-3xl opacity-30"></div>
      
      <form onsubmit="handleLogin(event)" class="relative z-10">
        <div class="mb-5">
          <label class="block text-sm font-bold text-slate-700 mb-2">Email / Tên đăng nhập</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
            </div>
            <input type="text" required class="w-full pl-11 pr-4 py-3 border border-white/50 bg-white/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#52B788] focus:bg-white transition-colors backdrop-blur-sm shadow-inner" placeholder="Nhập email...">
          </div>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold text-slate-700 mb-2">Mật khẩu</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
            </div>
            <input type="password" required class="w-full pl-11 pr-4 py-3 border border-white/50 bg-white/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#52B788] focus:bg-white transition-colors backdrop-blur-sm shadow-inner" placeholder="Nhập mật khẩu...">
          </div>
        </div>
        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#2D6A4F] to-[#52B788] hover:from-[#1B4332] hover:to-[#40916C] text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-[#52B788]/30 hover:-translate-y-0.5">
          <i data-lucide="log-in" class="w-5 h-5"></i> Đăng nhập
        </button>
      </form>
      <p class="text-center text-sm text-slate-600 mt-5 relative z-10 font-medium">Quên mật khẩu? <a href="#" class="text-[#2D6A4F] hover:text-[#1B4332] font-bold underline decoration-2 underline-offset-4">Khôi phục ngay</a></p>
    </div>
    
    <!-- Signup Form -->
    <div id="signup-form" class="glass-card rounded-[24px] p-7 shadow-2xl relative overflow-hidden hidden">
      <div class="absolute -left-10 -top-10 w-32 h-32 bg-[#52B788] rounded-full blur-3xl opacity-30"></div>
      
      <form onsubmit="handleSignup(event)" class="relative z-10">
        <div class="mb-4">
          <label class="block text-sm font-bold text-slate-700 mb-2">Họ và tên</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="user-circle" class="w-5 h-5 text-slate-400"></i>
            </div>
            <input type="text" required class="w-full pl-11 pr-4 py-3 border border-white/50 bg-white/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#52B788] focus:bg-white transition-colors backdrop-blur-sm shadow-inner" placeholder="Nguyễn Văn A">
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="mail" class="w-5 h-5 text-slate-400"></i>
            </div>
            <input type="email" required class="w-full pl-11 pr-4 py-3 border border-white/50 bg-white/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#52B788] focus:bg-white transition-colors backdrop-blur-sm shadow-inner" placeholder="email@example.com">
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-bold text-slate-700 mb-2">Tên đăng nhập</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="at-sign" class="w-5 h-5 text-slate-400"></i>
            </div>
            <input type="text" required class="w-full pl-11 pr-4 py-3 border border-white/50 bg-white/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#52B788] focus:bg-white transition-colors backdrop-blur-sm shadow-inner" placeholder="nguyenvana">
          </div>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold text-slate-700 mb-2">Mật khẩu</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
            </div>
            <input type="password" required class="w-full pl-11 pr-4 py-3 border border-white/50 bg-white/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#52B788] focus:bg-white transition-colors backdrop-blur-sm shadow-inner" placeholder="Tối thiểu 6 ký tự">
          </div>
        </div>
        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#2D6A4F] to-[#52B788] hover:from-[#1B4332] hover:to-[#40916C] text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-[#52B788]/30 hover:-translate-y-0.5">
          <i data-lucide="user-plus" class="w-5 h-5"></i> Đăng ký tài khoản
        </button>
      </form>
      <p class="text-center text-xs text-slate-500 mt-5 relative z-10 font-medium">Bằng việc đăng ký, bạn đồng ý với <a href="#" class="text-[#2D6A4F] hover:text-[#1B4332] font-bold">điều khoản sử dụng</a></p>
    </div>
  </div>
</div>
